language: "en"
intents:
  ViewAssistShowCamera:
    data:
      - sentences:
          - "(show | display | view) [the] {name} (camera | cameras | cam | cams | feed | feeds)"

lists:
  name:
    wildcard: true

responses:
  intents:
    ViewAssistShowCamera:
      default: >
        {% if slots.found %}
        {% if slots.kind == 'all' %}Showing all cameras.
        {% elif slots.kind == 'group' %}Showing {{ slots.name }} cameras.
        {% else %}Showing {{ slots.name }} camera.{% endif %}
        {% elif slots.empty %}There are no cameras in {{ slots.name }}.
        {% else %}Sorry, I couldn't find a camera called {{ slots.name }}.{% endif %}
