# View Assist Enhanced Sentences for Timers, Alarms, Reminders and Commands
# Version 1.0
language: "en"

lists:
  timer_alarm_or_timer:
    values:
      - in: timer
        out: timer
      - in: alarm
        out: alarm
  timer_class:
    values:
      - in: timer[s]
        out: timer
      - in: alarm[s]
        out: alarm
      - in: reminder[s]
        out: reminder
      - in: command[s]
        out: command
  timer_dayofweek:
    values:
      - in: today
        out: today
      - in: tomorrow
        out: tomorrow
      - in: monday
        out: monday
      - in: tuesday
        out: tuesday
      - in: wednesday
        out: wednesday
      - in: thursday
        out: thursday
      - in: friday
        out: friday
      - in: saturday
        out: saturday
      - in: sunday
        out: sunday
  timer_days:
    range:
      from: 1
      to: 365
  timer_time:
    wildcard: true

expansion_rules:
  timer_duration_seconds: "{timer_seconds:seconds}( |-)second[s]"
  timer_duration_minutes: "{timer_minutes:minutes}( |-)minute[s]"
  timer_duration_hours: "{timer_hours:hours}( |-)hour[s]"
  timer_duration_days: "{timer_days:days}( |-)day[s]"

  timer_duration_minutes_seconds: "<timer_duration_minutes> [[and] <timer_duration_seconds>]"
  timer_duration_hours_minutes_seconds: "<timer_duration_hours> [[and] <timer_duration_minutes>] [[and] <timer_duration_seconds>]"
  timer_duration_days_hours_minutes_seconds: "<timer_duration_days> [[and] <timer_duration_hours>] [[and] <timer_duration_minutes>] [[and] <timer_duration_seconds>]"
  timer_duration: "<timer_duration_days_hours_minutes_seconds> | <timer_duration_hours_minutes_seconds> | <timer_duration_minutes_seconds> | <timer_duration_seconds>"

  reminder_set: "(remind|reminder|remind me|set a reminder|set a reminder for|set a reminder to)"
  timer_status: "(what is|what's|how long is|how long's|how much is|how much time is) (left|remaining|still|still left|still remaining) [on|for]"

intents:
  HassStartTimer:
    data:
      - sentences:
          - "<timer_set> [a|an|the|my] {timer_alarm_or_timer:type} for <timer_duration> [(named|called) {timer_name:name}]"
          - "<timer_set> [a|an|the|my] <timer_duration> {timer_alarm_or_timer:type} [(named|called|for) {timer_name:name}]"
          - "<timer_set> [a|an|the|my] {timer_name:name} {timer_alarm_or_timer:type} for <timer_duration>"
          - "<timer_set> [a|an|the|my] {timer_alarm_or_timer:type} for {timer_dayofweek:dayofweek} at {timer_time:time} [(named|called) {timer_name:name}]"
          - "<timer_set> [a|an|the|my] {timer_alarm_or_timer:type} for {timer_time:time} {timer_dayofweek:dayofweek} [(named|called) {timer_name:name}]"
          - "<timer_set> [a|an|the|my] {timer_alarm_or_timer:type} for {timer_time:time}"

        response: va_timer_started_response

      - sentences:
          - "<reminder_set> [to|for] {timer_name:name} [for|in] <timer_duration>"
          - "<reminder_set> [for|in] <timer_duration> [to|for] {timer_name:name}"
          - "<reminder_set> [to|for] {timer_name:name} [for|on] [{timer_dayofweek:dayofweek} at] {timer_time:time}"
          - "<reminder_set> [for] [{timer_dayofweek:dayofweek} at] {timer_time:time} to {timer_name:name}"
        slots:
          type: reminder
        response: va_timer_started_response

      - sentences:
          - "{timer_command:conversation_command} (in|after) <timer_duration>"
          - "{timer_command:conversation_command} at {timer_time:time}"
          - "{timer_command:conversation_command} [on] {timer_dayofweek:dayofweek} at {timer_time:time}"
          - "(in|after) <timer_duration> {timer_command:conversation_command}"
        slots:
          type: command
        response: va_timer_started_response

  HassCancelTimer:
    data:
      - sentences:
          - "<timer_cancel> [the|my] {timer_class:type} [(named|called) {timer_name:name}]"
          - "<timer_cancel> [the|my] <timer_duration> {timer_class:type} [(named|called) {timer_name:name}]"
          - "<timer_cancel> [the|my] [{timer_dayofweek:dayofweek} at] {timer_time:time} {timer_class:type} [(named|called) {timer_name:name}]"
          - "<timer_cancel> [the|my] {timer_name:name} {timer_class:type} [set for <timer_duration>]"
          - "<timer_cancel> [the|my] {timer_class:type} [(named|called) {timer_name:name}] set for [{timer_dayofweek:dayofweek} at] {timer_time:time}"
        response: va_timer_cancelled_response

  HassTimerStatus:
    data:
      - sentences:
          - "<timer_status> [the|my] {timer_class:type} [(named|called) {timer_name:name}]"
          - "<timer_status> [the|my] <timer_duration> {timer_class:type} [(named|called) {timer_name:name}]"
          - "<timer_status> [the|my] {timer_class:type} for [{timer_dayofweek:dayofweek} at] {timer_time:time}"
        response: va_timer_status_response


responses:
  intents:
    HassStartTimer:
      va_timer_started_response: >
        {% set class = slots.class if slots.class is defined else none %}
        {% set type = slots.type if slots.type is defined else none %}

        {% set d = slots.days if slots.days is defined else none %}
        {% set h = slots.hours if slots.hours is defined else none %}
        {% set m = slots.minutes if slots.minutes is defined else none %}
        {% set s = slots.seconds if slots.seconds is defined else none %}
        {% set d_text = d ~ (' day'    if d in [ "1", 'one'] else ' days') if d else '' %}
        {% set h_text = h ~ (' hour'   if h in [ "1", 'one'] else ' hours') if h else '' %}
        {% set m_text = m ~ (' minute' if m in [ "1", 'one'] else ' minutes') if m else '' %}
        {% set s_text = s ~ (' second' if s in [ "1", 'one'] else ' seconds') if s else '' %}
        {% set duration_text_list = [ h_text, m_text, s_text] | select() | list %}
        {% set duration_text = duration_text_list[:-1] | join(', ') ~ ' and ' ~ duration_text_list[-1] if duration_text_list | count > 2 else duration_text_list | join(' and ') %}

        {% set name = slots.name if slots.name is defined else none %}
        {% set name_text = ' named ' ~ name if name else '' %}

        {% set dayofweek = slots.dayofweek if slots.dayofweek is defined else none %}
        {% set time = slots.time if slots.time is defined else none %}

        {# Build the response based on the class and type #}

        {% if class in ['timer', 'alarm'] %}
          {% if type == 'interval' %}
            {{ class }} set for {{ duration_text }}{{ name_text }}
          {% else %}
            {% set time_text = (dayofweek ~ ' at ' ~ time) if dayofweek else time %}
            {{ class }} set for {{ time_text }} {{ name_text }}
          {% endif %}
        {% elif class == 'reminder' %}
          {% if type == 'interval' %}
            OK, I will remind you to {{ name }} in {{ duration_text }}
          {% else %}
            {% set time_text = (' on ' ~ dayofweek ~ ' at ' ~ time) if dayofweek else (' at ' ~ time) %}
            OK, I will remind you to {{ name }} {{ time_text }}
          {% endif %}
        {% elif class == 'command' %}
          {% if type == 'interval' %}
            OK, I will {{ name }} in {{ duration_text }}
          {% else %}
            {% if dayofweek in 'today','tomorrow' %}
              {% set time_text = (dayofweek ~ ' at ' ~ time) %}
            {% else %}
              {% set time_text = (' on ' ~ dayofweek ~ ' at ' ~ time) if dayofweek else (' at ' ~ time) %}
            {% endif %}
            OK, I will {{ name }} {{ time_text }}
          {% endif %}
        {% endif %}

    HassCancelTimer:
      va_timer_cancelled_response: >
        {% set class = slots.class if slots.class is defined else none %}
        {% set name = slots.name if slots.name is defined else none %}
        {% set name_text = ' named ' ~ name if name else '' %}
        {% set interval_or_timer = slots.interval_or_time if slots.interval_or_time is defined else '' %}

        {% if class in ['timer','alarm'] %}
          OK, I have cancelled your {{ interval_or_timer }} {{ class }} {{ name_text }}
        {% elif class == 'reminder' %}
          OK, I have cancelled your {{ name }} reminder for {{ interval_or_timer }}
        {% elif class == 'command' %}
          OK, I have cancelled your {{ name_text }} command for {{ interval_or_timer }}
        {% endif %}

    HassTimerStatus:
      va_timer_status_response: >
        {% set num_timers = slots.timers | length %}

        {# Build the response based on the number of timers and their details #}
        {% if num_timers == 0 %}
          You have no active {{ slots.class }}s{{ ' named ' ~ slots.name if slots.name is defined else '' }}.
        {% else %}
          {% set timer = slots.timers[0] %}
          {% set class = timer.timer_class if timer.timer_class is defined else none %}
          {% set name = timer.name if timer.name is defined else none %}

          {% if timer.timer_type == 'interval' %}
            {% set d = timer.rounded_days_left if timer.rounded_days_left is defined else none %}
            {% set h = timer.rounded_hours_left if timer.rounded_hours_left is defined else none %}
            {% set m = timer.rounded_minutes_left if timer.rounded_minutes_left is defined else none %}
            {% set s = timer.rounded_seconds_left if timer.rounded_seconds_left is defined else none %}
            {% set d_text = d ~ (' day'    if d in [ "1", 'one'] else ' days') if d else '' %}
            {% set h_text = h ~ (' hour'   if h in [ "1", 'one'] else ' hours') if h else '' %}
            {% set m_text = m ~ (' minute' if m in [ "1", 'one'] else ' minutes') if m else '' %}
            {% set s_text = s ~ (' second' if s in [ "1", 'one'] else ' seconds') if s else '' %}
            {% set duration_text_list = [ h_text, m_text, s_text] | select() | list %}
            {% set duration_text = duration_text_list[:-1] | join(', ') ~ ' and ' ~ duration_text_list[-1] if duration_text_list | count > 2 else duration_text_list | join(' and ') %}

            {% if num_timers == 1 %}
              There is {{ duration_text }} remaining on your {{ name if name else '' }} {{ class }}.
            {% else %}
              You have {{ num_timers }} active {{ class }}s. The earliest {{ ' named ' ~ name if name else '' }} has {{ duration_text }} remaining.
            {% endif %}
          {% else %}
            {% set dayofweek = timer.dayofweek if timer.dayofweek is defined else none %}
            {% set time = timer.time if timer.time is defined else none %}
            {% set time_text = (dayofweek ~ ' at ' ~ time) if dayofweek else time %}

            {% if num_timers == 1 %}
              You have 1 {{ class }} {{ ' named ' ~ name if name else '' }} set for {{ time_text }}.
            {% else %}
              You have {{ num_timers }} active {{ class }}s. The earliest {{ ' named ' ~ name if name else '' }} is set for {{ time_text }}.
            {% endif %}
          {% endif %}
        {% endif %}



