language: "en"
lists:
  mode:
    values:
      - in: normal
        out: normal
      - in: cycle
        out: cycle
      - in: camera
        out: camera
intents:
  ViewAssistSetMode:
    data:
      - sentences:
          - "set mode to {mode}"
          - "turn on {mode} mode"
          - "set [to] {mode} mode"
responses:
  intents:
    ViewAssistSetMode:
      default: >
        {% set mode = slots.mode if slots.mode is defined else none %}
        "Setting mode to {{mode}}"