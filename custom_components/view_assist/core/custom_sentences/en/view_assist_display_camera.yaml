language: "en"
lists:
  camera:
    wildcard: true

intents:
  ViewAssistDisplayCamera:
    data:
      - sentences:
          - "(display|show) (my|the) {camera} [camera]"
          - "(display|show) (my|the|all) [my|the] cameras"
  ViewAssistCancelCamera:
    data:
      - sentences:
          - "(cancel|stop) (my|the) camera"

responses:
  intents:
    ViewAssistDisplayCamera:
      default: >
        {% if slots.not_found %}
          Sorry, I couldn't find a camera called {{ slots.name }}.
        {% elif slots.kind == 'empty' %}
          {% if slots.name %}There are no cameras in {{ slots.name }}.{% else %}There are no cameras available.{% endif %}
        {% elif slots.kind == 'group' %}
          Displaying {{ slots.name }} cameras.
        {% elif slots.kind == 'single' %}
          Displaying the {{ slots.name }} camera.
        {% else %}
          Displaying all cameras.
        {% endif %}
    ViewAssistCancelCamera:
      default: >
        OK