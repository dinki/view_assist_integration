language: "en"
expansion_rules:
  thermostat: (thermostat[s]|climate[s])

intents:
  HassClimateSetTemperature:
    data:
      - sentences:
          - "(increase|raise) [the] (<temp>|thermostat) by {temperature}[([ ]°)|( degree[s])]"
          - "(increase|raise) [<the>] {area} (<temp>|thermostat) by {temperature}[([ ]°)|( degree[s])]"
          - "(increase|raise) [<the>] {floor} [floor] (<temp>|thermostat) by {temperature}[([ ]°)|( degree[s])]"
        slots:
          temp_type: increase_delta
        response: climate_increase

      - sentences:
          - "(decrease|lower|reduce) [the] (<temp>|thermostat) by {temperature}[([ ]°)|( degree[s])]"
          - "(decrease|lower|reduce) [<the>] {area} (<temp>|thermostat) by {temperature}[([ ]°)|( degree[s])]"
          - "(decrease|lower|reduce) [<the>] {floor} [floor] (<temp>|thermostat) by {temperature}[([ ]°)|( degree[s])]"
        slots:
          temp_type: decrease_delta
        response: climate_decrease

      - sentences:
          - "(set|change) [the] (<temp>|thermostat) to {temperature}[([ ]°)|( degree[s])]"
          - "(set|change) [<the>] {area} (<temp>|thermostat) to {temperature}[([ ]°)|( degree[s])]"
          - "(set|change) [<the>] {floor} [floor] (<temp>|thermostat) to {temperature}[([ ]°)|( degree[s])]"
        response: default
  ViewAssistShowClimate:
    data:
      - sentences:
          - <show> [me] [my|the] {area} <thermostat>
          - <show> [me] [my|the] {floor} [floor] <thermostat>
          - <show> [me] [my|the] all [the] <thermostat>
responses:
  intents:
    HassClimateSetTemperature:
      climate_increase: >
        {% set error = slots.error if slots.error is defined else none %}
        {% if error == 'out_of_range' %}
            The requested temperature is not allowed.
        {% elif error == 'climate_off' %}
            The thermostat is off.
        {% elif error == 'unavailable' %}
            Temperature adjustment is not available.
        {% elif error == 'incompatible_device' %}
            Thermostats cannot be shown on this device.
        {% else %}
            {% set temperature = slots.temperature if slots.temperature is defined else none %}
            "Temperature increased by {{ temperature }} {{ 'degree' if (temperature | float) == 1 else 'degrees' }}"
        {% endif %}
      climate_decrease: >
        {% set error = slots.error if slots.error is defined else none %}
        {% if error == 'out_of_range' %}
            The requested temperature is not allowed.
        {% elif error == 'climate_off' %}
            The thermostat is off.
        {% elif error == 'unavailable' %}
            Temperature adjustment is not available.
        {% elif error == 'incompatible_device' %}
            Thermostats cannot be shown on this device.
        {% else %}
            {% set temperature = slots.temperature if slots.temperature is defined else none %}
            "Temperature decreased by {{ temperature }} {{ 'degree' if (temperature | float) == 1 else 'degrees' }}"
        {% endif %}
    ViewAssistShowClimate:
      default: >
        {% set error = slots.error if slots.error is defined else none %}
        {% set name = slots.name if slots.name is defined else none %}
        {% set area = slots.area if slots.area is defined else none %}
        {% set floor = slots.floor if slots.floor is defined else none %}

        {% if error == 'incompatible_device' %}
            Thermostats cannot be shown on this device.
        {% elif error == 'not_found' %}
            No thermostats found.
        {% else %}
            {% if name %}
                Showing the {{ name }} thermostat.
            {% elif area %}
                Showing thermostats in the {{ area }} area.
            {% elif floor %}
                Showing thermostats on the {{ floor }} floor.
            {% else %}
                Showing all thermostats.
            {% endif %}
        {% endif %}
