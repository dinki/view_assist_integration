language: "en"
lists:
  view:
    values:
      - in: clock
        out: clock
      - in: weather
        out: weather
      - in: info
        out: info
      - in: infopic
        out: infopic
      - in: music
        out: music
      - in: alarm
        out: alarm
      - in: intent
        out: intent
intents:
  ViewAssistChangeView:
    data:
      - sentences:
          - "set view [to] {view} [view]"
          - "change [the] view [to] {view}"
          - "change [to] {view} view"
          - "set [to] {view} view"
          - "show [me] [the] {view} view"
          - "go to [the] {view} view"
          - "switch to [the] {view} view"
responses:
  intents:
    ViewAssistChangeView:
      default: >
        {% set view = slots.view if slots.view is defined else none %}
        "Setting view to {{view}}"
